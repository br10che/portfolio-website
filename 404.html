<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Page not found · Viola Sanyan</title>
    <!-- Paths start with / because this page can show up at any address -->
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/assets/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css?v=5">
</head>
<body>
    <!-- =====================================================
         404 — shown by Nginx for any address that doesn't exist
    ====================================================== -->
    <main class="notfound container">
        <a href="/" class="nav-logo" aria-label="sanyan, home">sanyan<svg class="logo-capsule" viewBox="0 0 72 100" aria-hidden="true"><g transform="translate(36 66) rotate(-40) scale(1.18)"><rect class="cap-a" x="-28" y="-13" width="56" height="26" rx="13"/><path class="cap-b" d="M0 -13 H15 A13 13 0 0 1 15 13 H0 Z"/></g></svg></a>

        <!-- The same capsule as on the home page, already open -->
        <div class="about-photo open notfound-art" aria-hidden="true">
            <div class="blob">
                <div class="pill">
                    <span class="pill-half pill-left"></span>
                    <span class="pill-half pill-right"></span>
                </div>
                <div class="pill-bits" id="pillBits"></div>
            </div>
            <div class="blob-ring"></div>
        </div>

        <p class="notfound-code mono">404</p>
        <h1 class="notfound-title" id="nfTitle">this page spilled out</h1>
        <p class="notfound-text" id="nfText">The address doesn't exist, or it moved. Everything else is still on the home page.</p>
        <a href="/" class="btn btn-primary" id="nfHome">back home</a>
    </main>

    <script src="/js/404.js?v=1"></script>
</body>
</html>
